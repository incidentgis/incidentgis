<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Incident GIS logo">
  <defs>
    <radialGradient id="ig-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffb199" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ff5a5f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7a0a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ig-pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="60%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#7a0a1f"/>
    </linearGradient>
    <linearGradient id="ig-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1d8"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- soft passion glow -->
  <circle cx="32" cy="34" r="26" fill="url(#ig-glow)"/>
  <!-- outer ring (GIS target) -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="url(#ig-ring)" stroke-width="2" stroke-dasharray="3 4" opacity="0.85"/>
  <!-- inner crosshair -->
  <g stroke="#1a0008" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="14" x2="32" y2="20"/>
    <line x1="32" y1="48" x2="32" y2="54"/>
    <line x1="10" y1="34" x2="16" y2="34"/>
    <line x1="48" y1="34" x2="54" y2="34"/>
  </g>
  <!-- incident pin -->
  <path d="M32 8c-7.18 0-13 5.6-13 12.5 0 9.5 13 23.5 13 23.5s13-14 13-23.5C45 13.6 39.18 8 32 8z"
        fill="url(#ig-pin)" stroke="#1a0008" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- pin dot (heartbeat) -->
  <circle cx="32" cy="21" r="4.5" fill="#fff5f5"/>
  <circle cx="32" cy="21" r="2.2" fill="#c8102e"/>
  <!-- spark accents -->
  <path d="M48 12 L51 8 L50 13 L55 12 L50 15 L52 19 L48 17 L45 20 L46 16 L42 16 L46 14 Z"
        fill="#ffba2a" opacity="0.9"/>
</svg>
